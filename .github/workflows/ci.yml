name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Mock uçtan uca
        run: |
          kovan run "CI deneme" --mock -d "$RUNNER_TEMP/kovan-ci"
          kovan report --stdout

  studio:
    name: Kovan Studio (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/js/package-lock.json
      - name: Kur
        run: npm ci --prefix tests/js
      - name: Sözdizimi
        run: for f in docs/js/*.js tests/js/*.js; do node --check "$f"; done
      - name: Testler
        working-directory: tests/js
        run: node --test
