[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kovan"
version = "0.4.0"
description = "Tek prompt, çok ajan: Claude Code ve Codex'i MCP ile birlikte çalıştıran orkestratör"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/ramiz28615/new"
Demo = "https://ramiz28615.github.io/new/"

[project.scripts]
kovan = "kovan.cli:main"

[tool.setuptools]
packages = ["kovan"]

[tool.setuptools.package-data]
kovan = ["dashboard.html"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
